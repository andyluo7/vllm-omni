# Validation draft only. Preserve the complete original TTS lane and audio gates.
env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60
steps:
- group: ROCm exact ad7 TTS audio diagnostic
  steps:
  - label: "TTS Function 1-GPU \xB7 exact ad7 response audio diagnostic"
    agent_pool: mi300_1
    mirror_hardwares:
    - amdproduction
    grade: NonBlocking
    timeout_in_minutes: 130
    artifact_paths:
    - artifacts/rocm-tts-audio-diagnostic/**/*
    commands:
    - export VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    - export VLLM_USE_DEEP_GEMM=0
    - export VLLM_MOE_USE_DEEP_GEMM=0
    - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-tts-audio-diagnostic"
    - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
    - BUILDKITE_COMMIT=ad7c78e1589347c6b0580faf69afd107fdbaf5b1 python3 .buildkite/amd/scripts/rocm_ci_evidence.py
      environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
    - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
    - python3 "$$BUILDKITE_BUILD_CHECKOUT_PATH/tools/ci/diagnose_rocm_function_audio.py"
      --case tts_1gpu --output "$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-tts-audio-diagnostic"
    - python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
      --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt" --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"
