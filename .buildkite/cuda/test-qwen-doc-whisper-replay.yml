# Temporary diagnostic pipeline for the retained CUDA #16446 audio.
# The image and source helper hashes match the failed c30 revision.
steps:
  - label: "Qwen Documentation Whisper-small replay · H100 · 2-GPU"
    key: qwen-doc-whisper-replay
    timeout_in_minutes: 20
    artifact_paths:
      - qwen-doc-whisper-replay/**/*
    commands:
      - timeout 900 python3 tools/ci/replay_qwen_doc_whisper.py --device cuda:1
    agents:
      queue: mithril-h100-pool
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - image: 936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:c30e63d04dc9a54c5c4b43235eb2ce535fe68df3
                resources:
                  limits:
                    nvidia.com/gpu: 2
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /root/.cache/huggingface
            nodeSelector:
              node.kubernetes.io/instance-type: gpu-h100-sxm
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
              - name: hf-cache
                hostPath:
                  path: /mnt/hf-cache
                  type: DirectoryOrCreate
